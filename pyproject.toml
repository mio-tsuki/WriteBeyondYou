[project]
name = "writebeyondyou"
version = "0.1.0"
description = "A modern PyTorch implementation of WriteLikeYou."
readme = "README.md"
authors = [
    { name = "Mizuno Miotsuki", email = "founder@crepuse.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.5",
    "numpy>=2.4.6",
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
